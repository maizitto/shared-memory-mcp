name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:workerd
      - run: npm run demo
      - run: npm run demo:scenarios -- --json
      - run: npm run evaluate:retrieval
      - run: npm run build
      - run: npm run check
